query GetNamesByName($labelName: String!) {
  wrappedDomains(where: { domain_: { labelName: $labelName } }) {
    id
    name
    owner {
      id
      domains {
        id
        labelName
        labelhash
        name
        resolver {
          id
          address
        }
      }
    }
    domain {
      id
      name
      labelName
      labelhash
      isMigrated
      expiryDate
      createdAt
      registration {
        cost
      }
      resolvedAddress {
        id
      }
      resolver {
        id
        address
        texts
        coinTypes
        addr {
          id
        }
      }
    }
    fuses
    expiryDate
  }
}

