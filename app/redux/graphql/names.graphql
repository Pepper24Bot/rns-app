query NamesByAddress(
  $expiryDate_gte: BigInt = "0"
  $expiryDate_lt: BigInt = "0"
  $first: Int = 1000
  $skip: Int = 0
  $name: String = ""
  $id: ID = ""
  $orderDirection: OrderDirection = desc
  $orderBy: Domain_orderBy = registration__registrationDate
  $ensName: String = ""
  $sortByLength: Boolean = false
) {
  domains(
    where: {
      wrappedOwner_: { id: $id }
      name_contains: $name
      expiryDate_gte: $expiryDate_gte
      expiryDate_lt: $expiryDate_lt
    }
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    labelName
    labelhash
    name
    isMigrated
    parent {
      name
    }
    createdAt
    resolvedAddress {
      id
    }
    owner {
      id
    }
    registrant {
      id
    }
    wrappedOwner {
      id
    }
    registration {
      cost
      registrationDate
      expiryDate
    }
    wrappedDomain {
      expiryDate
      fuses
    }
    resolver {
      texts
      coinTypes
    }
  }
}

query Names($first: Int = 1000, $lastId: ID = "") {
  domains(
    first: $first
    orderBy: id
    orderDirection: asc
    where: { id_gt: $lastId, labelName_not: "" }
  ) {
    labelName
    expiryDate
    registration {
      registrationDate
      expiryDate
    }
    wrappedDomain {
      expiryDate
    }
    wrappedOwner {
      id
    }
    id
  }
}

query Owner($labelName: String = "") {
  domains(where: { labelName: $labelName }) {
    labelName
    wrappedOwner {
      id
    }
  }
}
